name: Release

# Disparo manual apenas (botão "Run workflow" na aba Actions). Um merge na main
# não publica sozinho: o semantic-release decide a versão pelos commits, e
# publicar passa a ser uma decisão explícita.
on:
    workflow_dispatch:

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
              with:
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: 'lts/gallium'
            - name: Install dependencies
              run: yarn install
            - name: Build release
              run: yarn build
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npx semantic-release
