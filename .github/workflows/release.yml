name: Release

# Disparo manual apenas (botão "Run workflow" na aba Actions). Um merge na main
# não publica sozinho: o semantic-release decide a versão pelos commits, e
# publicar passa a ser uma decisão explícita.
on:
    workflow_dispatch:

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
              with:
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: 'lts/gallium'
            - name: Install dependencies
              run: yarn install
            - name: Build release
              run: yarn build
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
                  # Hooks de git sao ferramenta de desenvolvedor, nao portao de CI.
                  # O @semantic-release/git cria o commit `chore(release): x.y.z` com
                  # as release notes inteiras no corpo, e o commit-msg do husky roda
                  # commitlint em cima dele: qualquer entrada de changelog com footer
                  # acima de 100 chars (footer-max-line-length) derruba a release no
                  # passo `prepare`, antes do publish. Foi o que aconteceu na 2.3.0.
                  # `.husky/_/husky.sh` respeita HUSKY=0 (husky v7).
                  HUSKY: 0
              run: npx semantic-release
